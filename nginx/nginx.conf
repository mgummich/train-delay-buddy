# nginx/nginx.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header Referrer-Policy           "no-referrer"                         always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'" always;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # API + health proxied to Go backend
    location /v1/ {
        proxy_pass         http://backend:8080;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering    off;
    }

    location /health {
        proxy_pass http://backend:8080;
    }

    location /readyz {
        proxy_pass http://backend:8080;
    }

    # /metrics must NOT be exposed through nginx
    location /metrics {
        deny all;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Vite content-hashed static assets — immutable cache
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
