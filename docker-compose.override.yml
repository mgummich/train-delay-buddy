# docker-compose.override.yml
services:
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app:cached
    ports: ["8080:8080"]
    environment:
      - LOG_LEVEL=DEBUG
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    deploy:
      resources: {}

  postgres:
    ports: ["5432:5432"]

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=
    command: npm run dev -- --host 0.0.0.0
