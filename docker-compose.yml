# docker-compose.yml

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  nginx:
    build:
      context: ./frontend
      target: prod
    image: verspaetungs-begleiter-frontend:latest
    ports: ["127.0.0.1:80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  backend:
    build:
      context: ./backend
      target: production
    image: verspaetungs-begleiter-backend:latest
    env_file: .env
    environment:
      - PORT=8080
      # Valkey is a BSD-licensed Redis fork; URLs use the redis:// scheme for
      # protocol compatibility with go-redis. REDIS_URL is also honoured as a
      # backwards-compatible fallback (see internal/config.Load).
      - VALKEY_URL=redis://valkey:6379
      - DATABASE_URL=postgres://vbb:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/vbb
      - MIGRATIONS_DIR=/app/migrations
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    <<: *default-security
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  valkey:
    image: valkey/valkey:8.1.8-alpine3.23
    command: valkey-server --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    <<: *default-security
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 300m
          cpus: "0.5"

  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: vbb
      POSTGRES_USER: vbb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  postgres_data:
